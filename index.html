<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<meta name="theme-color" content="#163C74">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<meta name="apple-mobile-web-app-title" content="إدارة شؤوني">
<meta name="description" content="إدارة شؤوني: أموالك وبيتك وخططك وسياراتك وديونك ومستنداتك في مكان واحد، يعمل بدون إنترنت">

<title>إدارة شؤوني</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <header class="top">
    <div class="brand"><span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h10a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H7z"/><path d="M7 3v18"/><path d="M4.5 7.5h4M4.5 12h4M4.5 16.5h4"/><path d="M11 8.5h5M11 12h5"/></svg></span>إدارة شؤوني</div>
    <div class="hdr-actions"><button class="sync" id="sync" type="button" aria-label="حالة الحفظ والمزامنة"><span>محفوظ في هاتفك فقط</span></button><button class="iconbtn" id="prBtn" type="button" aria-label="طباعة تقرير هذه الصفحة" title="طباعة تقرير هذه الصفحة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 9V3.5h10V9"/><rect x="3.5" y="9" width="17" height="8" rx="2"/><path d="M7 14h10v6.5H7z"/><path d="M17 12h.01"/></svg></button><button class="iconbtn" id="lookBtn" type="button" aria-label="المظهر"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.6-.8 1.6-1.6 0-.5-.2-.8-.4-1.1-.3-.3-.4-.7-.4-1.1 0-.9.7-1.6 1.6-1.6H16a5 5 0 0 0 5-5c0-4.1-4-7.6-9-7.6z"/><circle cx="7.5" cy="11" r="1.2" fill="currentColor"/><circle cx="10.5" cy="7.5" r="1.2" fill="currentColor"/><circle cx="15" cy="7.5" r="1.2" fill="currentColor"/></svg></button></div>
  </header>
  <div class="monthbar" id="monthbar">
    <button id="mPrev" aria-label="الشهر السابق">›</button>
    <button id="mLabel" class="mlabel" type="button" aria-haspopup="dialog" aria-label="اختيار الشهر من التقويم"></button>
    <button id="mNext" aria-label="الشهر التالي">‹</button>
  </div>
  <main id="view"></main>
</div>

<nav class="tabs" aria-label="الأقسام"><div class="in">
  <button data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>الرئيسية</button>
  <button data-tab="monthly"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4.5" width="16" height="16" rx="2.5"/><path d="M8 2.5v4M16 2.5v4M4 9.5h16M8.5 14.5l2 2 4-4"/></svg>الدفع</button>
  <button data-tab="mbud"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg>الميزانية</button>
  <button data-tab="smartsav"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 10.5c0-3.6-3.1-6-7-6s-7 2.4-7 6c0 2 1 3.6 2.5 4.6V19h3v-2h3v2h3v-3.9c1.2-.8 2.1-2 2.4-3.6H21v-3h-1.6"/><path d="M9 8.5h3"/><circle cx="15.5" cy="9.5" r=".6" fill="currentColor"/></svg>الادخار</button>
  <button data-tab="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>المزيد</button>
</div></nav>

<button class="fab" id="addBtn" type="button" aria-label="إضافة عملية"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>

<div id="layer"></div>

<script src="app.js" defer></script>
</body>
</html>
